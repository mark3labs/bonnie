version: "2"

linters:
  enable:
    - depguard
    - staticcheck
    - unused
    - modernize

  settings:
    depguard:
      rules:
        # BONNIE is a separate Go module so the compiler already rejects
        # imports of github.com/mark3labs/kit/internal/... . This rule is the
        # belt to that suspenders: it produces a readable error early. It
        # applies to every file, tests included.
        public-kit-api-only:
          list-mode: lax
          deny:
            - pkg: github.com/mark3labs/kit/internal
              desc: >-
                BONNIE depends on the public Kit SDK only. Use
                github.com/mark3labs/kit/pkg/kit. If something you need is not
                exported, raise it upstream rather than reaching in.

        # fantasy is Kit's model layer. BONNIE names its types through the
        # aliases in kit/pkg/kit only, tests included: Kit aliases
        # fantasy.LanguageModel and each type its methods take, so even a
        # scripted model for a real Kit (internal/fakemodel) needs no direct
        # import.
        no-fantasy:
          list-mode: lax
          deny:
            - pkg: charm.land/fantasy
              desc: >-
                BONNIE names Kit types through the aliases in
                github.com/mark3labs/kit/pkg/kit (kit.LLMMessage,
                kit.LLMLanguageModel, ...), never through fantasy directly.
                Kit owns the model layer; a direct fantasy import pins BONNIE
                to Kit's transitive dependency and breaks the moment Kit
                changes it.

        fakemodel-in-tests-only:
          list-mode: lax
          files:
            - $all
            - "!$test"
          deny:
            - pkg: github.com/mark3labs/bonnie/internal/fakemodel
              desc: >-
                internal/fakemodel is a scripted model for tests. Import it
                from a _test.go file only; a shipped binary must never answer
                users from a script.

        flaky-in-tests-only:
          list-mode: lax
          files:
            - $all
            - "!$test"
          deny:
            - pkg: github.com/mark3labs/bonnie/internal/flaky
              desc: >-
                internal/flaky skips intermittent tests. Import it from a
                _test.go file only; shipped code must never skip itself.

        # `bonnie build` promises the user a single static binary, and
        # goreleaser cross-compiles four targets from one machine. Both stop
        # working the moment a C library enters the graph, so the journal's
        # SQLite driver must stay the pure-Go one.
        no-cgo:
          list-mode: lax
          deny:
            - pkg: github.com/mattn/go-sqlite3
              desc: >-
                BONNIE must build with CGO_ENABLED=0. Use the pure-Go driver
                modernc.org/sqlite, which runtime/sqlitejournal.go already
                registers.

formatters:
  enable:
    - gofmt
