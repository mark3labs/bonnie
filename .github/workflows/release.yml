name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      # goreleaser builds its body from commit subjects, which publishes a
      # commit list rather than the notes. Slice the tag's section out of
      # CHANGELOG.md and hand it to goreleaser instead. A tag whose version
      # has no section fails here, naming the heading, rather than publishing
      # a release that never states the claims or the limits. (T-027)
      - name: Extract release notes from CHANGELOG.md
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > /tmp/release-notes.md
          echo "--- release body ---"
          cat /tmp/release-notes.md

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep the flake's `bonnie-release` input on the newest tag. Without it,
  # `nix profile add github:mark3labs/bonnie` would install an older release:
  # a flake input cannot say "latest tag", so flake.nix pins a tag and this
  # job moves the pin, flake.lock, and the vendored-module hash.
  nix-release-pin:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    # The release is out either way at this point. The pin bump is a
    # follow-up for Nix users, so a failure here (a push race with a commit
    # that landed first, say) must not turn the release red. Run the steps
    # by hand instead; docs/RELEASE.md lists them.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The pin lives on the default branch, not on the release tag this
          # run was triggered from.
          ref: master
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Point the flake pin at the new release
        env:
          FULL_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/bump-flake-release-pin.sh "$FULL_TAG"
          # Lock the new tag only; nixpkgs keeps its pin.
          nix flake lock
          # The release may ship different Go dependencies, in which case the
          # vendored-module hash has to move with the pin.
          ./scripts/update-flake-vendor-hash.sh
          if git diff --quiet flake.nix flake.lock nix/bonnie.nix; then
            echo "flake already pins $FULL_TAG"
            exit 0
          fi
          git add flake.nix flake.lock nix/bonnie.nix
          git commit -m "chore(nix): pin flake to ${FULL_TAG} [skip ci]"
          git push origin master
