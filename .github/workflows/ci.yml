name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The journal is SQLite, and `bonnie build` promises the user a single
      # static binary. A driver that needs C would keep both claims compiling
      # here and break them on the user's machine, so the build is proven
      # with CGO off rather than asserted in prose.
      - name: Build with CGO disabled
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  # Each examples/<name> is an agent tree: a nested module that ./... above
  # never reaches. `go test` already built every tree against this checkout
  # (examples/examples_test.go); this job builds each one as a user does,
  # with `bonnie build` against the release its go.mod pins, and fails when
  # that leaves a diff — a stale bonnie_gen.go or an incomplete go.sum.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
      - uses: go-task/setup-task@v1
      - name: Build the examples as a user does
        run: task examples

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # Must be built with a Go at least as new as the `go` line in
          # go.mod. golangci-lint loads the config with its own toolchain and
          # refuses to run when that toolchain is older than the target,
          # exiting 3 with "the Go language version used to build
          # golangci-lint is lower than the targeted Go version". v2.1.0 is
          # built with go1.24 against a go.mod that asks for 1.27, so it could
          # never run. Raise this pin whenever the go.mod version moves.
          version: v2.13.2
