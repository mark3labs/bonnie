version: "3"

vars:
  BINARY: bonnie
  OUTPUT_DIR: output
  BUILD_FLAGS: -o {{.OUTPUT_DIR}}/{{.BINARY}}
  # Same shape goreleaser injects at release. In a dev build this makes
  # `bonnie --version` report the tag and dirty state instead of nothing.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  # -----------------------------------------------------------------------
  # Build
  # -----------------------------------------------------------------------

  build:
    desc: Build the bonnie binary
    cmds:
      - go build {{.BUILD_FLAGS}} -ldflags "{{.LDFLAGS}}" ./cmd/bonnie
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.OUTPUT_DIR}}/{{.BINARY}}"

  install:
    desc: Install bonnie to $GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cmd/bonnie

  # -----------------------------------------------------------------------
  # Run
  # -----------------------------------------------------------------------

  dev:
    desc: "Build and run the CLI (usage: task dev -- serve --journal .bonnie)"
    cmds:
      - task: build
      - "{{.OUTPUT_DIR}}/{{.BINARY}} {{.CLI_ARGS}}"

  serve:
    desc: "Build and start bonnie serve (usage: task serve -- --addr :8080)"
    cmds:
      - task: build
      - "{{.OUTPUT_DIR}}/{{.BINARY}} serve {{.CLI_ARGS}}"

  # -----------------------------------------------------------------------
  # Test
  # -----------------------------------------------------------------------

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./...

  test-v:
    desc: Run all tests (verbose)
    cmds:
      - go test -race -v ./...

  test-pkg:
    desc: "Run tests for a specific package (usage: task test-pkg -- ./runtime)"
    cmds:
      - go test -race -v {{.CLI_ARGS}}

  test-run:
    desc: "Run a single test by name (usage: task test-run -- TestResumeAcrossProcessBoundary)"
    cmds:
      - go test -race -v ./... -run {{.CLI_ARGS}}

  # The live suites skip cleanly without a provider key, and they must skip,
  # never fail — a CI-less machine has to be able to run everything else.
  test-live:
    desc: "Run the integration-tagged tests against a live model (needs a provider key)"
    cmds:
      - go test -race -tags integration ./runtime ./sandbox

  test-cover:
    desc: Run tests with a coverage report
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - go test -race -coverprofile={{.OUTPUT_DIR}}/coverage.out ./...
      - go tool cover -html={{.OUTPUT_DIR}}/coverage.out -o {{.OUTPUT_DIR}}/coverage.html
      - echo "Coverage report written to {{.OUTPUT_DIR}}/coverage.html"

  # -----------------------------------------------------------------------
  # Code quality
  # -----------------------------------------------------------------------

  lint:
    desc: Run golangci-lint and go vet
    cmds:
      - golangci-lint run ./...
      - go vet ./...

  fmt:
    desc: Format all Go files
    cmds:
      - go fmt ./...

  fmt-check:
    desc: Check formatting (fails if files need formatting)
    cmds:
      # Ask git for the file list, never `gofmt -l .`: .envrc puts GOPATH in
      # .direnv/, so walking the tree reports the whole module cache.
      #
      # --others adds a file that is written but not staged yet, which
      # --cached alone misses — a new package would otherwise reach CI
      # unchecked. --exclude-standard keeps .gitignore honoured, so .direnv
      # stays out however the list grows. A file staged in the index but
      # deleted from the working tree (a removal not yet committed) is still
      # --cached, so filter to paths that exist before gofmt stats them.
      - |
        files=$(git ls-files --cached --others --exclude-standard '*.go' | while IFS= read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done)
        [ -n "$files" ] || exit 0
        unformatted=$(gofmt -l $files)
        [ -z "$unformatted" ] || {
          echo "Files need formatting:"
          echo "$unformatted"
          exit 1
        }

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  check:
    desc: Run the quality loop a developer actually wants (fmt, lint, test)
    cmds:
      - task: fmt-check
      - task: lint
      - task: test

  # CI parity: CI must build against the Kit version pinned in go.mod, not a
  # local checkout. Run this before pushing.
  ci:
    desc: Run exactly what CI runs (build, vet, test, lint)
    cmds:
      - task: fmt-check
      - go build ./...
      - go vet ./...
      - go vet -tags integration ./...
      - go test -race ./...
      # The journal is SQLite. A driver needing C would break the static
      # binary `bonnie build` promises, so CGO-off is proven, not assumed.
      - CGO_ENABLED=0 go build ./...
      - golangci-lint run ./...

  # -----------------------------------------------------------------------
  # Release
  # -----------------------------------------------------------------------

  release-check:
    desc: Validate the goreleaser config
    cmds:
      - goreleaser check

  release-snapshot:
    desc: Build a release snapshot (no publish)
    cmds:
      - goreleaser release --snapshot --clean

  release-notes:
    desc: Print the CHANGELOG.md section the release body will carry (TAG=v0.5.0)
    cmds:
      - scripts/release-notes.sh {{.TAG}}
    requires:
      vars: [TAG]

  # -----------------------------------------------------------------------
  # Cleanup
  # -----------------------------------------------------------------------

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.OUTPUT_DIR}}
