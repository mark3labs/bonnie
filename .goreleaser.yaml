version: 2

project_name: bonnie

builds:
  - main: ./cmd/bonnie
    binary: bonnie
    env:
      - CGO_ENABLED=0
    # Linux only, deliberately.
    #
    # BONNIE's floor sandbox is the Linux Landlock LSM: every run is
    # sandboxed, and Landlock is the backend that makes that promise keepable
    # with nothing installed. A darwin build would ship a binary whose default
    # configuration cannot start, which is worse than not shipping it.
    #
    # Restoring macOS means writing a seatbelt (sandbox-exec) backend of equal
    # strength first, not adding the target back here.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # goreleaser v2.6 renamed `format` to `formats`. Use the new key so a
  # current goreleaser does not warn on every release.
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Bug fixes
      regexp: "^fix"
      order: 1
    - title: Documentation
      regexp: "^docs"
      order: 2
    - title: Tests
      regexp: "^test"
      order: 3

release:
  draft: false
  prerelease: false
